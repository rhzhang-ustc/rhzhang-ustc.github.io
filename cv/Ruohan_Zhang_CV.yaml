      - label: Simulation & CAD
        details: Blender, Abaqus, COMSOL, SOFA, SolidWorks, Onshape, Fusion 360, Altium Designer
      - label: Languages
        details: Chinese (native), English (professional working proficiency)

design:
  theme: engineeringclassic
  page:
    top_margin: 0.6in
    bottom_margin: 0.55in
    left_margin: 0.65in
    right_margin: 0.65in
    show_top_note: false
    show_footer: false
  colors:
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    links: rgb(255, 0, 0)
  typography:
    line_spacing: 0.5em
    alignment: justified
    font_family:
      body: Charter
      name: Charter
      headline: Charter
      connections: Charter
      section_titles: Charter
    font_size:
      body: 10pt
      name: 22pt
      headline: 9.5pt
      connections: 9.5pt
      section_titles: 1.2em
    bold:
      section_titles: true
  header:
    alignment: center
    space_below_name: 0.15cm
    space_below_headline: 0.15cm
    space_below_connections: 0.2cm
    connections:
      space_between_connections: 0.45cm
  section_titles:
    type: with_full_line
    line_thickness: 0.5pt
    space_above: 0.38cm
    space_below: 0.22cm
  sections:
    space_between_regular_entries: 0.9em
    space_between_text_based_entries: 0.2em
  entries:
    date_and_location_width: 3.6cm
    highlights:
      bullet: "-"
      space_above: 0.12cm
      space_between_items: 0.12cm
  templates:
    education_entry:
      main_column: |-
        **INSTITUTION**, LOCATION
        **DEGREE** in AREA; SUMMARY
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
