# One-page Chinese resume, published as files/cv-zh.pdf.
# The longer two-page version is Ruohan_Zhang_CV_zh_full.yaml; keep facts in sync.
# Adapt selection and emphasis to the audience; verify facts against the English CV.
cv:
  name: 张若涵 (Ruohan Zhang)
  headline: 求职方向：机器人感知与操作研发
  email: rz21@illinois.edu
  custom_connections:
    - fontawesome_icon: link
      placeholder: ruohan-zhang.com
      url: https://ruohan-zhang.com/
    - fontawesome_icon: github
      placeholder: GitHub
      url: https://github.com/rhzhang-ustc
    - fontawesome_icon: graduation-cap
      placeholder: Google Scholar
      url: https://scholar.google.com/citations?user=4hwZIh0AAAAJ
  sections:
    教育背景:
      - institution: 伊利诺伊大学厄巴纳-香槟分校（UIUC）
        area: 电气与计算机工程
        degree: 博士在读
        start_date: 2023-09
        end_date: present
        summary: '导师：Wenzhen Yuan；2025年5月获同专业硕士学位'
      - institution: 中国科学技术大学
        area: 电子工程与信息科学
        degree: 学士
        start_date: 2019-09
        end_date: 2023-06
        summary: 'GPA：4.05/4.30；排名：1/96；导师：Chong Luo'

    研究经历:
      - company: UIUC · RoboTouch Lab（导师：Wenzhen Yuan）
        position: ''
        start_date: 2023-09
        end_date: present
        highlights:
          - '**学习探索性动作以实现主动物理感知（RSS 2027 在投，第一作者）** 提出基于信念的强化学习策略，自主选择抓取、放置、推动、拖拽等动作基元，利用腕部力/力矩与深度信息推断物体的质量与摩擦系数；前向模型仅用仿真交互数据训练，并以粒子表示对物理属性的信念；对超出机械臂负载的物体仍能准确估计。在 45 个未见物体上，质量与摩擦估计误差较经典方法分别降低 45% 和 30%，不安全动作比例约为其三分之一，并无需微调部署到 UR5e 实体机器人。'
          - '**视触觉果实采摘夹爪 FruitTouch（RA-L 2026，第一作者）** 设计紧凑型光机结构并优化成像光路，适应不同尺寸果实的抓取；基于 ROS 实现实时力估计、滑移检测与软硬度预测，并在圣女果实地采摘实验中验证。'
          - '**软体机械臂形状与触觉感知 PneuGelSight（IJRR 2025，第一作者）** 结合光度立体法与深度学习，利用内嵌相机实现本体感知与触觉传感；形状重建平均 Chamfer 距离由 8.85 mm 降至 5.35 mm，表面纹理深度误差小于 0.2 mm，推理时间小于 0.05 s。'
          - '**人机触觉交互数据采集（IROS 2026，第二作者）** 设计并制作可穿戴触觉反馈手套，接入 VR 平台，采集人机交互中的全身接触数据。'
      - company: 微软亚洲研究院 · 智能多媒体实验室（负责人：Chong Luo）
        position: ''
        start_date: 2022-09
        end_date: 2023-07
        highlights:
          - '**扩散模型与目标跟踪** 开发严重遮挡条件下的扩散模型目标跟踪方法，并优化大规模数据集上的计算效率与内存占用。'

    代表论文:
      - title: Learning Exploratory Procedures for Active Physical Perception
        authors: ['**Zhang, R.**', 'Yuan, W.']
        journal: 'Robotics: Science and Systems (RSS)'
        short_venue: RSS（在投）
        date: 2027
        authorship: 第一作者
      - title: 'FruitTouch: A Perceptive Gripper for Gentle and Scalable Fruit Harvesting'
        authors: ['**Zhang, R.**', 'Mirzaee, M. A.', 'Yuan, W.']
        journal: IEEE Robotics and Automation Letters (RA-L)
        short_venue: IEEE RA-L
        date: 2026
        authorship: 第一作者
        links: '[项目主页](https://fruittouch-dev.github.io/fruittouch/)'
      - title: 'PneuGelSight: Soft Robotic Vision-Based Proprioception and Tactile Sensing'
        authors: ['**Zhang, R.**', 'Yoo, U.', 'Li, Y.', 'Agarwal, A.', 'Yuan, W.']
        journal: The International Journal of Robotics Research (IJRR)
        short_venue: IJRR
        date: 2025
        authorship: 第一作者
        links: '[项目主页](https://ruohan-zhang.com/PneuGelSight-project/) · [arXiv](https://arxiv.org/abs/2508.18443)'
      - title: Requirement-Driven Design of Whole-Body Social Tactile Sensing via Virtual Human-Robot Interaction
        authors: ['Crowder, D.', '**Zhang, R.**', 'Block, A. E.', 'Yuan, W.']
        journal: IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)
        short_venue: IEEE/RSJ IROS
        date: 2026
        authorship: 第二作者
        links: '[arXiv](https://arxiv.org/abs/2607.11690)'

    专业技能:
      - label: 机器人学习
        details: 强化学习、Sim-to-Real 迁移、粒子滤波状态估计、点云感知
      - label: 软件
        details: Python、C++、PyTorch、ROS、Isaac Lab、MuJoCo、MATLAB
      - label: 硬件
        details: UR5e 机械臂、WSG 50 夹爪、力/力矩传感器、深度相机、视触觉传感器
      - label: 设计与仿真
        details: SolidWorks、Onshape、Fusion 360、Blender；Abaqus、COMSOL、SOFA 有限元分析

    荣誉与学术服务:
      - label: 荣誉
        details: 郭沫若奖学金（中国科学技术大学本科生最高荣誉），2023年；国家奖学金，2021年、2022年
      - label: 学术服务
        details: IJRR、RA-L、T-RL、ICRA、IROS 审稿人；UIUC ECE 205、ECE 206 课程助教

design:
  theme: engineeringclassic
  page:
    size: a4
    top_margin: 0.5in
    bottom_margin: 0.45in
    left_margin: 0.65in
    right_margin: 0.65in
    show_top_note: false
    show_footer: false
  colors:
    name: rgb(0, 0, 0)
    headline: rgb(0, 0, 0)
    section_titles: rgb(0, 0, 0)
    connections: rgb(0, 0, 0)
    links: rgb(46, 78, 104)
  typography:
    line_spacing: 0.65em
    alignment: left
    font_family:
      body: Songti SC
      name: Songti SC
      headline: Songti SC
      connections: Charter
      section_titles: Songti SC
    font_size:
      body: 10pt
      name: 20pt
      headline: 9.5pt
      connections: 9.5pt
      section_titles: 1.2em
    bold:
      section_titles: true
  header:
    alignment: center
    space_below_name: 0.18cm
    space_below_headline: 0.18cm
    space_below_connections: 0.3cm
    connections:
      space_between_connections: 0.45cm
  section_titles:
    type: with_full_line
    line_thickness: 0.35pt
    space_above: 0.32cm
    space_below: 0.2cm
  sections:
    allow_page_break: false
    space_between_regular_entries: 0.55em
    space_between_text_based_entries: 0.25em
  entries:
    date_and_location_width: 3.9cm
    highlights:
      bullet: "-"
      space_above: 0.12cm
      space_between_items: 0.12cm
  templates:
    single_date: YEAR.MONTH_IN_TWO_DIGITS
    date_range: START_DATE - END_DATE
    one_line_entry:
      main_column: 'LABEL：DETAILS'
    publication_entry:
      main_column: |-
        TITLE
        SHORT_VENUE, DATE · AUTHORSHIP · LINKS
      date_and_location_column: ''
    education_entry:
      main_column: |-
        **INSTITUTION**
        AREA · DEGREE；SUMMARY
      date_and_location_column: DATE
    experience_entry:
      main_column: |-
        **COMPANY**
        HIGHLIGHTS
      date_and_location_column: DATE
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: OUTCOME

locale:
  language: mandarin_chinese
