cv:
  name: 张若涵 (Ruohan Zhang)
  headline: 求职方向：机器人感知与操作研发
  email: rz21@illinois.edu
  custom_connections:
    - fontawesome_icon: link
      placeholder: ruohan-zhang.com
      url: https://ruohan-zhang.com/
    - fontawesome_icon: github
      placeholder: GitHub
      url: https://github.com/rhzhang-ustc
    - fontawesome_icon: graduation-cap
      placeholder: Google Scholar
      url: https://scholar.google.com/citations?user=4hwZIh0AAAAJ
  sections:
    教育背景:
      - institution: 伊利诺伊大学厄巴纳-香槟分校（UIUC）
        area: 电气与计算机工程
        degree: 博士在读
        start_date: 2023-09
        end_date: present
        summary: '导师：Wenzhen Yuan；2025年5月获同专业硕士学位'
      - institution: 中国科学技术大学
        area: 电子工程与信息科学
        degree: 学士
        start_date: 2019-09
        end_date: 2023-06
        summary: 'GPA：4.05/4.30；排名：1/96；导师：Chong Luo'

    核心技能:
      - label: 算法开发
        details: Python、C/C++、PyTorch；视觉触觉感知、强化学习、扩散模型
      - label: 机器人系统
        details: ROS、Isaac Lab、MuJoCo；传感器集成、实时感知与实物实验
      - label: 机械与电路设计
        details: SolidWorks、Onshape、Fusion 360、Altium Designer
      - label: 仿真与分析
        details: Blender、Abaqus、COMSOL、SOFA、MATLAB

    代表性项目:
      - name: 视触觉果实采摘夹爪（FruitTouch）
        outcome: RA-L 2026 · 第一作者
        summary: 'UIUC RoboTouch Lab｜通过夹爪内的触觉感知实现果实无损采摘'
        highlights:
          - 设计紧凑型光机结构，优化成像光路，适应不同尺寸果实的抓取。
          - 基于 ROS 实现实时力估计、滑移检测与软硬度预测，为夹持过程提供接触反馈。
          - 完成圣女果实地采摘实验，验证抓取稳定性与果实损伤防护效果。
      - name: 软体机械臂形状与触觉感知（PneuGelSight）
        outcome: IJRR 2025 · 第一作者
        summary: 'UIUC RoboTouch Lab｜利用内嵌相机同时感知机械臂形状与接触表面'
        highlights:
          - 结合光度立体法与深度学习，实现气动软体机械臂的本体感知与触觉传感。
          - 形状重建平均 Chamfer 距离由 8.85 mm 降至 5.35 mm。
          - 表面纹理深度误差小于 0.2 mm，推理时间小于 0.05 s。

    研究经历:
      - company: UIUC · RoboTouch Lab
        position: ''
        start_date: 2023-09
        end_date: present
        summary: '导师：Wenzhen Yuan'
        research_details: |-
          **学习探索性动作以感知物理属性**

          提出基于信念的强化学习策略，自主选择抓取、放置、推动、拖拽等动作基元，利用腕部力/力矩与深度信息推断物体的质量与摩擦系数。在 45 个未见物体上，质量与摩擦估计误差较经典方法分别降低 45% 和 30%，不安全事件约为其三分之一，并无需微调部署到 UR5e 实体机器人。相关论文：RSS 2027 在投，第一作者。

          #v(0.28cm)
          **人机触觉交互数据采集**

          设计并制作可穿戴触觉反馈手套，接入 VR 平台，采集人机交互中的全身接触数据。相关合作论文：IROS 2026，第二作者。
      - company: 微软亚洲研究院 · 智能多媒体实验室
        position: ''
        start_date: 2022-09
        end_date: 2023-07
        summary: '负责人：Chong Luo，首席研究员'
        research_details: |-
          **扩散模型与目标跟踪**

          开发严重遮挡条件下的扩散模型目标跟踪方法，并针对大规模数据集优化计算效率与内存占用。

    代表论文:
      - title: Learning Exploratory Procedures for Physical Property Perception
        authors: ['**Zhang, R.**', 'Yuan, W.']
        journal: 'Robotics: Science and Systems (RSS)'
        short_venue: RSS（在投）
        date: 2027
        authorship: 第一作者
      - title: 'FruitTouch: A Perceptive Gripper for Gentle and Scalable Fruit Harvesting'
        authors: ['**Zhang, R.**', 'Mirzaee, M. A.', 'Yuan, W.']
        journal: IEEE Robotics and Automation Letters (RA-L)
        short_venue: IEEE RA-L
        date: 2026
        authorship: 第一作者
        links: '[项目主页](https://fruittouch-dev.github.io/fruittouch/)'
      - title: 'PneuGelSight: Soft Robotic Vision-Based Proprioception and Tactile Sensing'
        authors: ['**Zhang, R.**', 'Yoo, U.', 'Li, Y.', 'Agarwal, A.', 'Yuan, W.']
        journal: The International Journal of Robotics Research (IJRR)
        short_venue: IJRR
        date: 2025
        authorship: 第一作者
        links: '[项目主页](https://ruohan-zhang.com/PneuGelSight-project/) · [arXiv](https://arxiv.org/abs/2508.18443)'
      - title: Requirement-Driven Design of Whole-Body Social Tactile Sensing via Virtual Human-Robot Interaction
        authors: ['Crowder, D.', '**Zhang, R.**', 'Block, A. E.', 'Yuan, W.']
        journal: IEEE/RSJ International Conference on Intelligent Robots and Systems (IROS)
        short_venue: IEEE/RSJ IROS
        date: 2026
        authorship: 第二作者
        links: '[arXiv](https://arxiv.org/abs/2607.11690)'

    荣誉与学术服务:
      - label: 郭沫若奖学金
        details: 2023年，中国科学技术大学本科生最高荣誉（前 1%）
      - label: 国家奖学金
        details: 2021年、2022年
      - label: 学术审稿
        details: IJRR、RA-L、T-RL；ICRA、IROS
      - label: 课程助教
        details: UIUC，ECE 205（2025年春季）、ECE 206（2025年秋季）
      - label: 语言
        details: 中文（母语）；英语（科研与工作交流）

