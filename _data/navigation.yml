# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# The English and Chinese CVs are published as PDFs. Their editable RenderCV
# sources live in cv/ and should be kept in sync.

main:
  - title: "Home"
    url: /

  - title: "Teaching"
    url: /teaching/

  - title: "CV"
    url: /files/cv.pdf

  # - title: "Talks"
  #   url: /talks/

  # - title: "Blog Posts"
  #   url: /year-archive/

# Chinese mirror of the header links. Rendered on pages with `lang: zh`.
# Keep in sync with `main:` above.
main_zh:
  - title: "主页"
    url: /zh/

  - title: "教学"
    url: /zh/teaching/

  - title: "简历"
    url: /files/cv-zh.pdf
